# Production composition for the Vortex Trading Terminal.
#
# Only Nginx on the host reaches the internet. Every published port is bound to 127.0.0.1, which is
# also why no CORS policy is needed: Nginx serves the frontend and the API from one origin.
#
# Validate before starting, without printing secrets:
#   docker compose --env-file .env -f compose.yaml config --quiet

name: vortex-trading

services:
  # Applies migrations once per deploy and exits. Schema changes stay out of the API's startup, as the
  # persistence design requires, and the API then starts only against a schema that already exists.
  migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: vortex-trading-api:latest
    command: ["--migrate"]
    environment:
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=vortex_trading;Username=vortex_trading;Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    # Run once and exit; a failure must stop the deploy rather than be retried silently.
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: vortex-trading-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      # Outside Development there is no User Secrets store, so the connection string comes from the
      # environment, which is the mechanism the persistence design already documented.
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=vortex_trading;Username=vortex_trading;Password=${POSTGRES_PASSWORD}"
      VortexTrading__ApplicationName: "Vortex Trading Terminal"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: vortex-trading-web:latest
    environment:
      # The Next.js server resolves this to build its own server-side calls, such as the demo chart
      # snapshot, which it fetches directly from inside the compose network. It must not be
      # 127.0.0.1: inside the container that address is the container itself.
      #
      # This is separate from the browser path: the browser calls the same-origin /api prefix, which
      # Nginx on the host forwards to the api service. Neither one needs CORS because of that split.
      VORTEX_API_BASE_URL: "http://api:8080"
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: vortex_trading
      POSTGRES_USER: vortex_trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The official image layout for major 18 keeps PGDATA under /var/lib/postgresql/18/docker.
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex_trading -d vortex_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
